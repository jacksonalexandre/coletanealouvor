name: Deploy no GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Hinário, vídeos e Bíblia vêm do Supabase em tempo de execução (tabelas
      # coletanea_*); o build só precisa da URL e da chave pública (anon), nas
      # variáveis do repositório (Settings → Secrets and variables → Actions → Variables).

      - name: Build (GitHub Pages serve em /<repo>/)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Client ID do login com o Google (Settings → Secrets and variables →
          # Actions → Variables). Vazio, o botão de login simplesmente não aparece.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      # GitHub Pages não tem um "_redirects" como a Netlify: para abrir
      # /projecao direto (ou dar F5 nela) sem 404, o 404.html vira uma cópia
      # do index.html e o roteador do lado do cliente resolve a rota real.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
